global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Scrapes metrics exposed by the FastAPI app at /metrics
  - job_name: "intern_analytics_api"
    static_configs:
      - targets: ["host.docker.internal:8000"]

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
