databases:
  - name: intern-analytics-db
    plan: free
    databaseName: intern_analytics
    user: intern_admin

services:
  - type: web
    name: intern-analytics-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: intern-analytics-db
          property: connectionString
      - key: PORT
        value: 8000
    healthCheckPath: /health
