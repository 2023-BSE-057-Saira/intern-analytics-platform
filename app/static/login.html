<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in · Ezitech Institute</title>
<link rel="stylesheet" href="/static/css/base.css">
<style>
  html, body { height: 100%; }

  .login-shell {
    min-height: 100vh;
    position: relative;
    background: linear-gradient(150deg, var(--navy) 0%, #142958 55%, var(--purple) 160%);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px;
    overflow: hidden;
  }

  .bg-dots {
    position: absolute;
    inset: 0;
    background-image: radial-gradient(rgba(255,255,255,0.08) 1px, transparent 1px);
    background-size: 26px 26px;
    opacity: 0.5;
  }

  .signal-grid {
    position: absolute;
    inset: 0;
    display: grid;
    grid-template-columns: repeat(16, 1fr);
    grid-template-rows: repeat(10, 1fr);
    padding: 30px;
    gap: 14px;
  }
  .signal-grid span {
    width: 4px; height: 4px;
    border-radius: 50%;
    background: rgba(255,255,255,0.14);
    justify-self: center; align-self: center;
  }
  .signal-grid span.pulse {
    background: var(--blue);
    animation: pulse 3.2s ease-in-out infinite;
  }
  .signal-grid span.pulse.amber { background: var(--amber); animation-duration: 2.6s; }
  .signal-grid span.pulse.d1 { animation-delay: 0.6s; }
  .signal-grid span.pulse.d2 { animation-delay: 1.4s; }
  .signal-grid span.pulse.d3 { animation-delay: 2.1s; }

  @keyframes pulse {
    0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(47,111,237,0.5); }
    50% { transform: scale(2.2); box-shadow: 0 0 0 6px rgba(47,111,237,0); }
  }

  .login-card {
    position: relative;
    z-index: 2;
    width: 100%;
    max-width: 420px;
    background: white;
    border-radius: 20px;
    padding: 40px 36px 32px;
    box-shadow: 0 24px 60px rgba(5,10,30,0.35);
    text-align: center;
  }

  .avatar-ring {
    width: 68px; height: 68px;
    margin: 0 auto 18px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #EEF2FF, #DCE4FF);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 0 6px rgba(124,92,252,0.08);
  }
  .avatar-ring .icon-circle {
    width: 44px; height: 44px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--blue), var(--purple));
    display: flex; align-items: center; justify-content: center;
    color: white;
    font-size: 19px;
  }

  .login-card h2 {
    font-size: 22px;
    margin-bottom: 5px;
  }
  .login-card .subhead {
    color: var(--subtle);
    font-size: 14px;
    margin-bottom: 28px;
  }

  .field { text-align: left; margin-bottom: 16px; }
  .field label {
    display: flex;
    justify-content: space-between;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--ink);
    margin-bottom: 6px;
  }
  .field-input-wrap {
    position: relative;
  }
  .field-input-wrap .field-icon {
    position: absolute;
    left: 13px; top: 50%;
    transform: translateY(-50%);
    font-size: 15px;
    opacity: 0.55;
  }
  .field input {
    width: 100%;
    padding: 11px 14px 11px 38px;
    border-radius: 10px;
    border: 1.5px solid var(--border);
    font-size: 14.5px;
    font-family: 'Inter', sans-serif;
    color: var(--ink);
  }
  .field input:focus {
    outline: none;
    border-color: var(--blue);
    box-shadow: 0 0 0 3px rgba(47,111,237,0.12);
  }

  .submit-btn {
    width: 100%;
    padding: 13px 16px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(90deg, var(--blue), var(--purple));
    color: white;
    font-size: 15px;
    font-weight: 600;
    margin-top: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .submit-btn:disabled { opacity: 0.65; cursor: not-allowed; }

  .error-box {
    background: #FEF2F2;
    border: 1px solid #FCA5A5;
    color: #B91C1C;
    font-size: 13px;
    padding: 10px 13px;
    border-radius: 10px;
    margin-bottom: 16px;
    text-align: left;
    display: none;
  }
  .error-box.visible { display: block; }

  .back-link {
    display: inline-block;
    margin-top: 22px;
    font-size: 13px;
    color: var(--subtle);
    text-decoration: none;
  }
  .back-link:hover { color: var(--blue); }

  .security-note {
    position: relative;
    z-index: 2;
    margin-top: 18px;
    color: #A9BBFF;
    font-size: 12.5px;
    text-align: center;
  }

  .auth-tabs {
    display: flex;
    background: #F1F3F9;
    border-radius: 10px;
    padding: 3px;
    margin-bottom: 24px;
  }
  .auth-tab {
    flex: 1;
    border: none;
    background: none;
    padding: 9px 10px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    color: var(--subtle);
  }
  .auth-tab.active { background: white; color: var(--ink); box-shadow: 0 1px 3px rgba(11,27,63,0.1); }

  .signup-form { display: none; }
  .signup-form.active { display: block; }
  #loginForm.hidden { display: none; }

  .form-row-2 { display: flex; gap: 10px; }
  .form-row-2 .field { flex: 1; }

  .login-card select {
    width: 100%;
    padding: 11px 14px;
    border-radius: 10px;
    border: 1.5px solid var(--border);
    font-size: 14.5px;
    font-family: 'Inter', sans-serif;
    color: var(--ink);
    background: white;
  }
  .login-card select:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 3px rgba(47,111,237,0.12); }
</style>
</head>
<body>

<div class="login-shell">
  <div class="bg-dots"></div>
  <div class="signal-grid" id="signalGrid"></div>

  <div>
    <div class="login-card">
      <div class="avatar-ring"><div class="icon-circle">🔒</div></div>
      <h2 id="cardTitle">Welcome back</h2>
      <p class="subhead" id="cardSubhead">Sign in to continue to your dashboard.</p>

      <div class="auth-tabs">
        <button type="button" class="auth-tab active" id="tabSignIn">Sign In</button>
        <button type="button" class="auth-tab" id="tabSignUp">Create Student Account</button>
      </div>

      <div class="error-box" id="errorBox"></div>

      <form id="loginForm">
        <div class="field">
          <label for="email">Email</label>
          <div class="field-input-wrap">
            <span class="field-icon">👤</span>
            <input type="email" id="email" name="email" autocomplete="username" required>
          </div>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <div class="field-input-wrap">
            <span class="field-icon">🔑</span>
            <input type="password" id="password" name="password" autocomplete="current-password" required>
          </div>
        </div>
        <button type="submit" class="submit-btn" id="submitBtn">Sign in</button>
      </form>

      <form id="signupForm" class="signup-form">
        <div class="field">
          <label for="su-name">Full Name</label>
          <div class="field-input-wrap">
            <span class="field-icon">👤</span>
            <input type="text" id="su-name" autocomplete="name" required>
          </div>
        </div>
        <div class="field">
          <label for="su-email">Email</label>
          <div class="field-input-wrap">
            <span class="field-icon">✉️</span>
            <input type="email" id="su-email" autocomplete="username" required>
          </div>
        </div>
        <div class="field">
          <label for="su-password">Password</label>
          <div class="field-input-wrap">
            <span class="field-icon">🔑</span>
            <input type="password" id="su-password" autocomplete="new-password" minlength="6" required>
          </div>
        </div>
        <div class="form-row-2">
          <div class="field">
            <label for="su-technology">Technology</label>
            <select id="su-technology" required>
              <option value="Laravel">Laravel</option>
              <option value="MERN Stack">MERN Stack</option>
              <option value="Artificial Intelligence">Artificial Intelligence</option>
              <option value="Flutter">Flutter</option>
              <option value="UI/UX">UI/UX</option>
              <option value="DevOps">DevOps</option>
            </select>
          </div>
          <div class="field">
            <label for="su-batch">Batch <span style="font-weight:400; color:var(--subtle);">(optional)</span></label>
            <div class="field-input-wrap">
              <input type="text" id="su-batch" placeholder="e.g. 2026-A" style="padding-left:14px;">
            </div>
          </div>
        </div>
        <button type="submit" class="submit-btn" id="signupBtn">Create account →</button>
      </form>

      <a href="/" class="back-link">&larr; Back to home</a>
    </div>
    <p class="security-note">🛡️ Your data is protected with role-based access control.</p>
  </div>
</div>

<script src="/static/js/auth.js"></script>
<script>
  const grid = document.getElementById("signalGrid");
  const total = 16 * 10;
  const pulseIndexes = new Set();
  while (pulseIndexes.size < 6) pulseIndexes.add(Math.floor(Math.random() * total));
  for (let i = 0; i < total; i++) {
    const dot = document.createElement("span");
    if (pulseIndexes.has(i)) {
      dot.classList.add("pulse");
      if (Math.random() < 0.35) dot.classList.add("amber");
      const d = Math.random();
      dot.classList.add(d < 0.33 ? "d1" : d < 0.66 ? "d2" : "d3");
    }
    grid.appendChild(dot);
  }

  const existing = getSession();
  if (existing && existing.access_token) redirectToDashboard(existing.role);

  const form = document.getElementById("loginForm");
  const signupForm = document.getElementById("signupForm");
  const errorBox = document.getElementById("errorBox");
  const submitBtn = document.getElementById("submitBtn");
  const signupBtn = document.getElementById("signupBtn");
  const tabSignIn = document.getElementById("tabSignIn");
  const tabSignUp = document.getElementById("tabSignUp");
  const cardTitle = document.getElementById("cardTitle");
  const cardSubhead = document.getElementById("cardSubhead");

  function showTab(tab) {
    errorBox.classList.remove("visible");
    const isSignIn = tab === "signin";
    tabSignIn.classList.toggle("active", isSignIn);
    tabSignUp.classList.toggle("active", !isSignIn);
    form.classList.toggle("hidden", !isSignIn);
    signupForm.classList.toggle("active", !isSignIn);
    cardTitle.textContent = isSignIn ? "Welcome back" : "Join as a student";
    cardSubhead.textContent = isSignIn
      ? "Sign in to continue to your dashboard."
      : "Set up your account — you'll be added to the platform instantly.";
  }
  tabSignIn.addEventListener("click", () => showTab("signin"));
  tabSignUp.addEventListener("click", () => showTab("signup"));

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    errorBox.classList.remove("visible");
    submitBtn.disabled = true;
    submitBtn.textContent = "Signing in...";

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    try {
      const session = await login(email, password);
      redirectToDashboard(session.role);
    } catch (err) {
      errorBox.textContent = err.message;
      errorBox.classList.add("visible");
      submitBtn.disabled = false;
      submitBtn.textContent = "Sign in →";
    }
  });

  signupForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    errorBox.classList.remove("visible");
    signupBtn.disabled = true;
    signupBtn.textContent = "Creating account...";

    const payload = {
      name: document.getElementById("su-name").value.trim(),
      email: document.getElementById("su-email").value.trim(),
      password: document.getElementById("su-password").value,
      technology: document.getElementById("su-technology").value,
      batch: document.getElementById("su-batch").value.trim() || null,
    };

    try {
      const session = await register(
        payload.name, payload.email, payload.password, payload.technology, payload.batch
      );
      redirectToDashboard(session.role);
    } catch (err) {
      errorBox.textContent = err.message;
      errorBox.classList.add("visible");
      signupBtn.disabled = false;
      signupBtn.textContent = "Create account →";
    }
  });
</script>
</body>
</html>
