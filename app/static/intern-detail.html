<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Intern Detail · Ezitech Institute</title>
<link rel="stylesheet" href="/static/css/base.css">
<link rel="stylesheet" href="/static/css/dashboard.css">
<style>
  /* Small additions specific to this page — kept here rather than
     growing dashboard.css with rules only one page uses. */
  .back-link {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 13px; font-weight: 600; color: var(--subtle);
    text-decoration: none; margin-bottom: 14px;
  }
  .back-link:hover { color: var(--blue); }
  .factor-row {
    display: flex; align-items: center; justify-content: space-between;
    font-size: 12.5px; padding: 5px 0; border-bottom: 1px solid #F4F6FC;
  }
  .factor-row:last-child { border-bottom: none; }
  .factor-name { color: var(--ink); }
  .factor-bar-wrap { display: flex; align-items: center; gap: 8px; }
  .factor-bar-track { width: 70px; height: 6px; background: #F0F2FA; border-radius: 4px; overflow: hidden; }
  .factor-bar-fill { height: 100%; border-radius: 4px; }
  .factor-val { width: 46px; text-align: right; font-weight: 600; }
  .pred-card {
    background: white; border: 1px solid var(--border); border-radius: 14px;
    padding: 18px; display: flex; flex-direction: column; gap: 10px;
  }
  .pred-card .pred-title { font-size: 12.5px; font-weight: 600; color: var(--subtle); text-transform: uppercase; letter-spacing: 0.03em; }
  .pred-card .pred-value { font-size: 24px; font-weight: 700; font-family: 'Poppins', sans-serif; color: var(--ink); }
  .pred-card .pred-meta { font-size: 11.5px; color: var(--subtle); }
  .pred-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 14px; margin-bottom: 8px; }
  .review-box { background: #FAFBFE; border-top: 1px solid var(--border); padding: 12px 18px; }
  .review-box textarea {
    width: 100%; min-height: 56px; padding: 8px 10px; border-radius: 8px;
    border: 1.5px solid var(--border); font-size: 12.5px; font-family: 'Inter', sans-serif; resize: vertical;
  }
  .review-box textarea:focus { outline: none; border-color: var(--blue); }
  .review-actions { display: flex; justify-content: flex-end; margin-top: 8px; }
  .btn-small {
    font-size: 12.5px; font-weight: 600; padding: 6px 14px; border-radius: 8px; border: none;
    background: linear-gradient(90deg, var(--blue), var(--purple)); color: white;
  }
  .btn-small:disabled { opacity: 0.6; }
  .reviewed-note { font-size: 12px; color: var(--green); font-weight: 600; padding: 12px 18px; background: #F3FBF6; }
</style>
</head>
<body>

<div class="app-shell">
  <aside class="sidebar">
    <div class="brand"><span class="dot"></span> EZITECH</div>
    <a href="#" id="backLink" class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      Back to Dashboard
    </a>
    <div class="help-card">
      <h5>Need help?</h5>
      <p>Ezitech Institute · AI-Powered Internship Performance & Risk Analytics Platform.</p>
      <a href="mailto:info@ezitech.org">Contact Support</a>
    </div>
  </aside>

  <div class="main-area">
    <div class="top-search-bar">
      <div></div>
      <div class="top-user-area">
        <div class="user-menu-wrap">
          <button class="user-menu-trigger" id="userMenuTrigger">
            <div class="avatar-circle" id="topAvatar" style="background:var(--blue)">?</div>
            <div class="name-block">
              <div class="name" id="userName">—</div>
              <div class="role" id="userRole">—</div>
            </div>
            <span class="chevron">▼</span>
          </button>
          <div class="user-menu-dropdown" id="userMenuDropdown">
            <button onclick="logout()">Log out</button>
          </div>
        </div>
      </div>
    </div>

    <div class="page-wrap">
      <a href="#" id="backLinkTop" class="back-link" style="display:none;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        Back to Dashboard
      </a>

      <div id="content">
        <div class="skeleton-kpi-row">
          <div class="skeleton-block"></div><div class="skeleton-block"></div>
          <div class="skeleton-block"></div><div class="skeleton-block"></div>
        </div>
        <div class="skeleton-table"><div class="skeleton-block"></div></div>
      </div>
    </div>
  </div>
</div>

<script src="/static/js/auth.js"></script>
<script>
  const AVATAR_COLORS = ["#2F6FED", "#7C5CFC", "#16A34A", "#D97706", "#DC2626", "#0EA5E9"];
  const internId = window.location.pathname.split("/").filter(Boolean).pop();

  const session = requireSession(["admin", "mentor", "student"]);
  let detailData = null;

  if (session) {
    document.getElementById("userName").textContent = session.name;
    document.getElementById("userRole").textContent = session.role[0].toUpperCase() + session.role.slice(1);
    document.getElementById("topAvatar").textContent = initials(session.name);
    document.getElementById("topAvatar").style.background = avatarColor(session.name);
    document.getElementById("backLink").href = `/${session.role}`;
    document.getElementById("backLinkTop").href = `/${session.role}`;
    document.getElementById("backLinkTop").style.display = "inline-flex";
    loadDetail();
  }

  const userMenuTrigger = document.getElementById("userMenuTrigger");
  const userMenuDropdown = document.getElementById("userMenuDropdown");
  userMenuTrigger.addEventListener("click", (e) => { e.stopPropagation(); userMenuDropdown.classList.toggle("open"); });
  document.addEventListener("click", () => userMenuDropdown.classList.remove("open"));

  function pct(value) { return value === null || value === undefined ? "—" : (value * 100).toFixed(1) + "%"; }
  function initials(name) {
    if (!name) return "?";
    const parts = name.trim().split(/\s+/);
    return (parts[0][0] + (parts[1] ? parts[1][0] : "")).toUpperCase();
  }
  function avatarColor(name) {
    if (!name) return AVATAR_COLORS[0];
    let hash = 0;
    for (let i = 0; i < name.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
    return AVATAR_COLORS[Math.abs(hash) % AVATAR_COLORS.length];
  }
  function timeAgo(iso) {
    if (!iso) return "never";
    const diffMs = Date.now() - new Date(iso).getTime();
    const mins = Math.floor(diffMs / 60000);
    if (mins < 1) return "just now";
    if (mins < 60) return `${mins}m ago`;
    const hrs = Math.floor(mins / 60);
    if (hrs < 24) return `${hrs}h ago`;
    const days = Math.floor(hrs / 24);
    return `${days}d ago`;
  }
  function statusBadge(status) {
    const map = {
      active: '<span class="status-badge status-active">Active</span>',
      completed: '<span class="status-badge status-completed">Completed</span>',
      dropped: '<span class="status-badge status-dropped">Dropped</span>',
    };
    return map[status] || `<span class="status-badge">${status || "—"}</span>`;
  }

  async function loadDetail() {
    try {
      const res = await apiFetch(`/interns/${internId}/detail`);
      if (!res.ok) {
        const body = await res.json().catch(() => ({}));
        if (res.status === 403) throw new Error("You're not authorized to view this intern.");
        if (res.status === 404) throw new Error("Intern not found.");
        throw new Error(body.detail || "Failed to load intern details.");
      }
      detailData = await res.json();
      render();
    } catch (err) {
      console.error("Intern detail load error:", err);
      document.getElementById("content").innerHTML = `<p class="loading-note">${err.message}</p>`;
    }
  }

  const PRED_LABELS = {
    dropout_risk: "Dropout Risk",
    performance_trend: "Performance Trend",
    success_probability: "Success Probability",
    learning_speed: "Learning Speed",
    skill_growth: "Skill Growth",
    completion_probability: "Completion Probability",
    project_success_probability: "Project Success Probability",
  };
  const PRED_ENDPOINTS = {
    dropout_risk: "/predict/dropout-risk",
    performance_trend: "/predict/performance-trend",
    success_probability: "/predict/success-probability",
    learning_speed: "/predict/learning-growth",
    completion_probability: "/predict/completion-probability",
    project_success_probability: "/predict/project-success-probability",
  };

  function formatPredValue(type, p) {
    if (type === "performance_trend" && p.explanation && p.explanation.predicted_label) {
      const map = { improving: "▲ Improving", stable: "▬ Stable", declining: "▼ Declining" };
      return map[p.explanation.predicted_label] || p.explanation.predicted_label;
    }
    if (["dropout_risk", "success_probability", "completion_probability", "project_success_probability"].includes(type)) {
      return pct(p.predicted_value);
    }
    return p.predicted_value.toFixed(3);
  }

  function renderFactors(explanation) {
    if (!explanation) return "";
    if (explanation.note && !explanation.top_factors) {
      return `<div class="pred-meta">${explanation.note}</div>`;
    }
    if (explanation.derived_from) {
      return `<div class="pred-meta">Derived: ${explanation.derived_from.replace(/_/g, " ")}</div>`;
    }
    if (!explanation.top_factors) return "";
    const maxAbs = Math.max(...explanation.top_factors.map(f => Math.abs(f.contribution)), 0.0001);
    return explanation.top_factors.map(f => {
      const widthPct = Math.min(100, Math.abs(f.contribution) / maxAbs * 100);
      const color = f.contribution >= 0 ? "var(--red)" : "var(--green)";
      return `<div class="factor-row">
        <span class="factor-name">${f.feature.replace(/_/g, " ")}</span>
        <span class="factor-bar-wrap">
          <span class="factor-bar-track"><span class="factor-bar-fill" style="width:${widthPct}%;background:${color}"></span></span>
          <span class="factor-val">${f.contribution > 0 ? "+" : ""}${f.contribution}</span>
        </span>
      </div>`;
    }).join("");
  }

  function renderPredictionCards() {
    const latest = detailData.latest_predictions;
    const types = Object.keys(PRED_LABELS);
    if (!Object.keys(latest).length) {
      return `<div class="data-card"><div class="loading-note" style="padding:20px 18px;">No predictions have been run for this intern yet. ${["admin","mentor","student"].includes(session.role) ? 'Use "Run New Predictions" below to generate the first set.' : ''}</div></div>`;
    }
    return `<div class="pred-grid">${types.map(type => {
      const p = latest[type];
      if (!p) return "";
      return `<div class="pred-card">
        <div class="pred-title">${PRED_LABELS[type]}</div>
        <div class="pred-value">${formatPredValue(type, p)}</div>
        ${renderFactors(p.explanation)}
        <div class="pred-meta">Last predicted ${timeAgo(p.created_at)}${p.confidence !== null && p.confidence !== undefined ? ` · ${(p.confidence*100).toFixed(0)}% confidence` : ""}</div>
      </div>`;
    }).join("")}</div>`;
  }

  function renderRecommendations() {
    const recs = detailData.recommendations;
    if (!recs.length) {
      return `<div class="loading-note" style="padding:16px 18px;">No recommendations generated yet.</div>`;
    }
    return recs.map(r => `
      <div class="rec-item">
        <div class="rec-avatar" style="background:${avatarColor(r.recommendation_type)}">AI</div>
        <div class="rec-body">
          <div class="rec-name">${r.recommendation_type.replace(/_/g, " ")} <span class="pill pill-gray" style="margin-left:6px;">${timeAgo(r.created_at)}</span></div>
          <div class="rec-message">${r.message}</div>
        </div>
      </div>`).join("");
  }

  function renderReviewList(items, kind) {
    // kind: "weekly-report" | "project-submission"
    if (!items || !items.length) {
      return `<div class="loading-note" style="padding:16px 18px;">None submitted yet.</div>`;
    }
    return items.map(item => {
      const idKey = kind === "weekly-report" ? item.report_id : item.submission_id;
      const title = kind === "weekly-report" ? `Week of ${item.week_start_date}` : item.title;
      const body = kind === "weekly-report"
        ? `${item.summary}${item.challenges ? `<br><em style="color:var(--subtle)">Challenges: ${item.challenges}</em>` : ""}`
        : `${item.description || ""}${item.repo_url ? `<br><a class="item-link" href="${item.repo_url}" target="_blank" rel="noopener">Repo →</a>` : ""}${item.demo_url ? ` &nbsp; <a class="item-link" href="${item.demo_url}" target="_blank" rel="noopener">Demo →</a>` : ""}`;
      const canReview = session.role === "mentor" && !item.reviewed;
      return `<div class="list-item-card" style="padding:0; overflow:hidden;">
        <div style="padding:16px 18px;">
          <div class="item-top">
            <span class="item-title">${title}</span>
            ${item.reviewed
              ? '<span class="pill pill-green">Reviewed</span>'
              : '<span class="pill pill-amber">Pending Review</span>'}
          </div>
          <div class="item-body">${body}</div>
        </div>
        ${item.reviewed
          ? `<div class="reviewed-note">✓ Reviewed${item.mentor_comment ? ` — "${item.mentor_comment}"` : ""}</div>`
          : canReview
            ? `<div class="review-box">
                <textarea id="comment-${kind}-${idKey}" placeholder="Optional comment for the intern…"></textarea>
                <div class="review-actions">
                  <button class="btn-small" onclick="markReviewed('${kind}', ${idKey}, this)">Mark Reviewed</button>
                </div>
              </div>`
            : ""}
      </div>`;
    }).join("");
  }

  async function markReviewed(kind, id, btnEl) {
    btnEl.disabled = true;
    btnEl.textContent = "Saving…";
    const comment = document.getElementById(`comment-${kind}-${id}`).value.trim();
    try {
      const res = await apiFetch(`/mentor/reviews/${kind}/${id}`, {
        method: "PATCH",
        body: JSON.stringify({ comment: comment || null }),
      });
      if (!res.ok) throw new Error("Failed to save review.");
      await loadDetail();
    } catch (err) {
      alert(err.message);
      btnEl.disabled = false;
      btnEl.textContent = "Mark Reviewed";
    }
  }

  async function runAllPredictions() {
    const btn = document.getElementById("runPredictionsBtn");
    btn.disabled = true;
    btn.textContent = "Running…";
    try {
      for (const endpoint of Object.values(PRED_ENDPOINTS)) {
        const res = await apiFetch(endpoint, {
          method: "POST",
          body: JSON.stringify({ intern_id: parseInt(internId, 10) }),
        });
        if (!res.ok) {
          const body = await res.json().catch(() => ({}));
          throw new Error(body.detail || `Prediction failed (${endpoint}).`);
        }
      }
      await loadDetail();
    } catch (err) {
      alert(err.message);
    } finally {
      btn.disabled = false;
      btn.textContent = "↻ Run New Predictions";
    }
  }

  async function generateRecommendations() {
    const btn = document.getElementById("genRecsBtn");
    btn.disabled = true;
    btn.textContent = "Generating…";
    try {
      const res = await apiFetch(`/recommendations/${internId}/generate`, { method: "POST" });
      if (!res.ok) {
        const body = await res.json().catch(() => ({}));
        throw new Error(body.detail || "Failed to generate recommendations.");
      }
      await loadDetail();
    } catch (err) {
      alert(err.message);
    } finally {
      btn.disabled = false;
      btn.textContent = "✦ Generate Recommendations";
    }
  }

  function render() {
    const i = detailData.intern;
    const canManage = session.role === "admin" || session.role === "mentor";
    const skills = (i.skills || "").split(",").map(s => s.trim()).filter(Boolean);

    document.getElementById("content").innerHTML = `
      <div class="page-banner">
        <p class="eyebrow">${i.technology} · ${i.batch || "No batch"}</p>
        <h1>${i.name}</h1>
        <p>${statusBadge(i.status)} &nbsp; ${i.email}</p>
      </div>

      <div class="profile-card" style="margin-bottom:24px;">
        <div class="profile-avatar-lg" style="background:${i.avatar_color || avatarColor(i.name)}">${initials(i.name)}</div>
        <div style="flex:1; min-width:0;">
          <h3>${i.name}</h3>
          <div class="profile-sub">${i.education || "No education info provided"}</div>
          <div class="profile-meta-row">
            <span class="pill">Started ${i.start_date || "—"}</span>
            ${i.expected_end_date ? `<span class="pill">Expected end ${i.expected_end_date}</span>` : ""}
            ${i.phone ? `<span class="pill">${i.phone}</span>` : ""}
          </div>
          ${skills.length ? `<div class="profile-meta-row">${skills.map(s => `<span class="pill pill-gray">${s}</span>`).join("")}</div>` : ""}
          ${i.bio ? `<p class="profile-bio">${i.bio}</p>` : ""}
          ${(i.linkedin_url || i.github_url) ? `<div class="profile-links">
            ${i.linkedin_url ? `<a href="${i.linkedin_url}" target="_blank" rel="noopener">LinkedIn ↗</a>` : ""}
            ${i.github_url ? `<a href="${i.github_url}" target="_blank" rel="noopener">GitHub ↗</a>` : ""}
          </div>` : ""}
        </div>
      </div>

      <div class="section-header-row">
        <div class="section-title" style="margin:0;"><span class="dot"></span> Predictions & Explainability</div>
        <button class="refresh-btn" id="runPredictionsBtn" onclick="runAllPredictions()">↻ Run New Predictions</button>
      </div>
      ${renderPredictionCards()}

      <div class="section-header-row" style="margin-top:26px;">
        <div class="section-title" style="margin:0;"><span class="dot"></span> Recommendations</div>
        ${canManage ? `<button class="refresh-btn" id="genRecsBtn" onclick="generateRecommendations()">✦ Generate Recommendations</button>` : ""}
      </div>
      <div class="data-card" style="padding:6px 0;">${renderRecommendations()}</div>

      ${canManage ? `
        <div class="section-title"><span class="dot"></span> Weekly Reports</div>
        ${renderReviewList(detailData.weekly_reports, "weekly-report")}

        <div class="section-title"><span class="dot"></span> Project Submissions</div>
        ${renderReviewList(detailData.project_submissions, "project-submission")}
      ` : ""}
    `;
  }
</script>
</body>
</html>
