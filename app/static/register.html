<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register · Ezitech Institute</title>
<link rel="stylesheet" href="/static/css/base.css">
<style>
  html, body { height: 100%; }

  .login-shell {
    min-height: 100vh;
    position: relative;
    background: linear-gradient(150deg, var(--navy) 0%, #142958 55%, var(--purple) 160%);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px;
    overflow: hidden;
  }

  .bg-dots {
    position: absolute;
    inset: 0;
    background-image: radial-gradient(rgba(255,255,255,0.08) 1px, transparent 1px);
    background-size: 26px 26px;
    opacity: 0.5;
  }

  .login-card {
    position: relative;
    z-index: 2;
    width: 100%;
    max-width: 460px;
    background: white;
    border-radius: 20px;
    padding: 40px 36px 32px;
    box-shadow: 0 24px 60px rgba(5,10,30,0.35);
    text-align: center;
  }

  .avatar-ring {
    width: 68px; height: 68px;
    margin: 0 auto 18px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #EEF2FF, #DCE4FF);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 0 6px rgba(124,92,252,0.08);
  }
  .avatar-ring .icon-circle {
    width: 44px; height: 44px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--blue), var(--purple));
    display: flex; align-items: center; justify-content: center;
    color: white;
    font-size: 19px;
  }

  .login-card h2 { font-size: 22px; margin-bottom: 5px; }
  .login-card .subhead { color: var(--subtle); font-size: 14px; margin-bottom: 26px; }

  .field { text-align: left; margin-bottom: 15px; }
  .field label {
    display: flex; justify-content: space-between;
    font-size: 12.5px; font-weight: 600; color: var(--ink);
    margin-bottom: 6px;
  }
  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .field-input-wrap { position: relative; }
  .field-input-wrap .field-icon {
    position: absolute; left: 13px; top: 50%; transform: translateY(-50%);
    font-size: 15px; opacity: 0.55;
  }
  .field input, .field select {
    width: 100%;
    padding: 11px 14px 11px 38px;
    border-radius: 10px;
    border: 1.5px solid var(--border);
    font-size: 14.5px;
    font-family: 'Inter', sans-serif;
    color: var(--ink);
    background: white;
    appearance: none;
  }
  .field input:focus, .field select:focus {
    outline: none;
    border-color: var(--blue);
    box-shadow: 0 0 0 3px rgba(47,111,237,0.12);
  }
  .field .hint { font-size: 11.5px; color: var(--subtle); font-weight: 400; }

  .submit-btn {
    width: 100%;
    padding: 13px 16px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(90deg, var(--blue), var(--purple));
    color: white;
    font-size: 15px;
    font-weight: 600;
    margin-top: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .submit-btn:disabled { opacity: 0.65; cursor: not-allowed; }

  .error-box {
    background: #FEF2F2;
    border: 1px solid #FCA5A5;
    color: #B91C1C;
    font-size: 13px;
    padding: 10px 13px;
    border-radius: 10px;
    margin-bottom: 16px;
    text-align: left;
    display: none;
  }
  .error-box.visible { display: block; }

  .back-link {
    display: inline-block;
    margin-top: 20px;
    font-size: 13px;
    color: var(--subtle);
    text-decoration: none;
  }
  .back-link:hover { color: var(--blue); }
  .back-link.strong { color: var(--blue); font-weight: 600; }
</style>
</head>
<body>

<div class="login-shell">
  <div class="bg-dots"></div>

  <div>
    <div class="login-card">
      <div class="avatar-ring"><div class="icon-circle">🎓</div></div>
      <h2>Create your intern account</h2>
      <p class="subhead">Register once, then track your own progress from day one.</p>

      <div class="error-box" id="errorBox"></div>

      <form id="registerForm">
        <div class="field">
          <label for="name">Full name</label>
          <div class="field-input-wrap">
            <span class="field-icon">👤</span>
            <input type="text" id="name" name="name" autocomplete="name" required>
          </div>
        </div>
        <div class="field">
          <label for="email">Email</label>
          <div class="field-input-wrap">
            <span class="field-icon">✉️</span>
            <input type="email" id="email" name="email" autocomplete="username" required>
          </div>
        </div>
        <div class="field-row">
          <div class="field">
            <label for="password">Password</label>
            <div class="field-input-wrap">
              <span class="field-icon">🔑</span>
              <input type="password" id="password" name="password" autocomplete="new-password" minlength="6" required>
            </div>
          </div>
          <div class="field">
            <label for="confirmPassword">Confirm</label>
            <div class="field-input-wrap">
              <span class="field-icon">🔑</span>
              <input type="password" id="confirmPassword" autocomplete="new-password" minlength="6" required>
            </div>
          </div>
        </div>
        <div class="field">
          <label for="technology">Technology track</label>
          <div class="field-input-wrap">
            <span class="field-icon">💻</span>
            <select id="technology" name="technology" required>
              <option value="" disabled selected>Choose your track…</option>
              <option>Laravel</option>
              <option>MERN Stack</option>
              <option>Artificial Intelligence</option>
              <option>Flutter</option>
              <option>UI/UX</option>
              <option>DevOps</option>
            </select>
          </div>
        </div>
        <div class="field">
          <label for="batch">Batch <span class="hint">(optional — leave blank if unsure)</span></label>
          <div class="field-input-wrap">
            <span class="field-icon">📅</span>
            <input type="text" id="batch" name="batch" placeholder="e.g. Summer 2026">
          </div>
        </div>
        <button type="submit" class="submit-btn" id="submitBtn">Create account →</button>
      </form>

      <a href="/login" class="back-link">Already have an account? <span class="strong">Sign in</span></a>
      <br>
      <a href="/" class="back-link">&larr; Back to home</a>
    </div>
  </div>
</div>

<script src="/static/js/auth.js"></script>
<script>
  const existing = getSession();
  if (existing && existing.access_token) redirectToDashboard(existing.role);

  const form = document.getElementById("registerForm");
  const errorBox = document.getElementById("errorBox");
  const submitBtn = document.getElementById("submitBtn");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    errorBox.classList.remove("visible");

    const name = document.getElementById("name").value.trim();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const confirmPassword = document.getElementById("confirmPassword").value;
    const technology = document.getElementById("technology").value;
    const batch = document.getElementById("batch").value.trim();

    if (password !== confirmPassword) {
      errorBox.textContent = "Passwords don't match.";
      errorBox.classList.add("visible");
      return;
    }
    if (password.length < 6) {
      errorBox.textContent = "Password must be at least 6 characters.";
      errorBox.classList.add("visible");
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = "Creating account...";

    try {
      const session = await register(name, email, password, technology, batch);
      redirectToDashboard(session.role);
    } catch (err) {
      errorBox.textContent = err.message;
      errorBox.classList.add("visible");
      submitBtn.disabled = false;
      submitBtn.textContent = "Create account →";
    }
  });
</script>
</body>
</html>
