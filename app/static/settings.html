<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Settings · Ezitech Institute</title>
<link rel="stylesheet" href="/static/css/base.css">
<link rel="stylesheet" href="/static/css/dashboard.css">
</head>
<body>

<div class="app-shell">
  <aside class="sidebar">
    <div class="brand"><span class="dot"></span> EZITECH</div>

    <a href="#" id="backToDashboard" class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m15 18-6-6 6-6"/></svg>
      Back to Dashboard
    </a>

    <div class="nav-section-label">Account</div>
    <a href="/settings" class="nav-item active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 13.5a2 2 0 0 0 .4 2.2l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a2 2 0 0 0-2.2-.4 2 2 0 0 0-1.2 1.8V20a2 2 0 1 1-4 0v-.2a2 2 0 0 0-1.2-1.8 2 2 0 0 0-2.2.4l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a2 2 0 0 0 .4-2.2 2 2 0 0 0-1.8-1.2H2a2 2 0 1 1 0-4h.2a2 2 0 0 0 1.8-1.2 2 2 0 0 0-.4-2.2l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a2 2 0 0 0 2.2.4H9a2 2 0 0 0 1.2-1.8V2a2 2 0 1 1 4 0v.2a2 2 0 0 0 1.2 1.8 2 2 0 0 0 2.2-.4l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a2 2 0 0 0-.4 2.2v.1a2 2 0 0 0 1.8 1.2H22a2 2 0 1 1 0 4h-.2a2 2 0 0 0-1.8 1.2Z"/></svg>
      Settings
    </a>

    <div class="help-card">
      <h5>Need help?</h5>
      <p>Ezitech Institute · AI-Powered Internship Performance & Risk Analytics Platform.</p>
      <a href="mailto:info@ezitech.org">Contact Support</a>
    </div>
  </aside>

  <div class="main-area">
    <div class="top-search-bar">
      <div></div>
      <div class="top-user-area">
        <div class="user-menu-wrap">
          <button class="user-menu-trigger" id="userMenuTrigger">
            <div class="avatar-circle" id="topAvatar" style="background:var(--blue)">·</div>
            <div class="name-block">
              <div class="name" id="userName">—</div>
              <div class="role" id="userRole">—</div>
            </div>
            <span class="chevron">▼</span>
          </button>
          <div class="user-menu-dropdown" id="userMenuDropdown">
            <button onclick="logout()">Log out</button>
          </div>
        </div>
      </div>
    </div>

    <div class="page-wrap" style="max-width:720px;">
      <div class="page-banner">
        <p class="eyebrow">Account</p>
        <h1>Settings</h1>
        <p>Manage your login and account security.</p>
      </div>

      <div class="form-card" style="margin-bottom:20px;">
        <div class="section-title" style="margin-top:0;"><span class="dot"></span> Account Info</div>
        <div class="form-grid">
          <div class="form-field">
            <label>Name</label>
            <input type="text" id="infoName" disabled>
          </div>
          <div class="form-field">
            <label>Role</label>
            <input type="text" id="infoRole" disabled style="text-transform:capitalize;">
          </div>
        </div>
      </div>

      <div class="form-card">
        <div class="section-title" style="margin-top:0;"><span class="dot"></span> Change Password</div>
        <form id="passwordForm">
          <div class="form-grid">
            <div class="form-field span-2">
              <label for="currentPassword">Current password</label>
              <input type="password" id="currentPassword" autocomplete="current-password" required>
            </div>
            <div class="form-field">
              <label for="newPassword">New password</label>
              <input type="password" id="newPassword" autocomplete="new-password" minlength="6" required>
            </div>
            <div class="form-field">
              <label for="confirmPassword">Confirm new password</label>
              <input type="password" id="confirmPassword" autocomplete="new-password" minlength="6" required>
            </div>
          </div>
          <div class="form-actions">
            <div class="form-note" id="passwordNote"></div>
            <button type="submit" class="btn-solid" id="passwordSubmitBtn">Update Password</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

<script src="/static/js/auth.js"></script>
<script>
  const AVATAR_COLORS = ["#2F6FED", "#7C5CFC", "#16A34A", "#D97706", "#DC2626", "#0EA5E9"];
  const session = requireSession(); // any authenticated role

  function initials(name) {
    if (!name) return "?";
    const parts = name.trim().split(/\s+/);
    return (parts[0][0] + (parts[1] ? parts[1][0] : "")).toUpperCase();
  }
  function avatarColor(name) {
    if (!name) return AVATAR_COLORS[0];
    let hash = 0;
    for (let i = 0; i < name.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
    return AVATAR_COLORS[Math.abs(hash) % AVATAR_COLORS.length];
  }

  if (session) {
    document.getElementById("userName").textContent = session.name;
    document.getElementById("userRole").textContent = session.role;
    document.getElementById("topAvatar").textContent = initials(session.name);
    document.getElementById("topAvatar").style.background = avatarColor(session.name);
    document.getElementById("infoName").value = session.name;
    document.getElementById("infoRole").value = session.role;
    document.getElementById("backToDashboard").href = `/${session.role}`;
  }

  const userMenuTrigger = document.getElementById("userMenuTrigger");
  const userMenuDropdown = document.getElementById("userMenuDropdown");
  userMenuTrigger.addEventListener("click", (e) => { e.stopPropagation(); userMenuDropdown.classList.toggle("open"); });
  document.addEventListener("click", () => userMenuDropdown.classList.remove("open"));

  document.getElementById("passwordForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const note = document.getElementById("passwordNote");
    const btn = document.getElementById("passwordSubmitBtn");
    note.className = "form-note";

    const currentPassword = document.getElementById("currentPassword").value;
    const newPassword = document.getElementById("newPassword").value;
    const confirmPassword = document.getElementById("confirmPassword").value;

    if (newPassword !== confirmPassword) {
      note.textContent = "New passwords don't match."; note.className = "form-note error";
      return;
    }

    btn.disabled = true; btn.textContent = "Updating…";
    try {
      const res = await apiFetch("/auth/change-password", {
        method: "POST",
        body: JSON.stringify({ current_password: currentPassword, new_password: newPassword }),
      });
      if (!res.ok) {
        const body = await res.json().catch(() => ({}));
        throw new Error(body.detail || "Couldn't update password.");
      }
      note.textContent = "Password updated successfully."; note.className = "form-note success";
      document.getElementById("passwordForm").reset();
    } catch (err) {
      note.textContent = err.message; note.className = "form-note error";
    } finally {
      btn.disabled = false; btn.textContent = "Update Password";
    }
  });
</script>
</body>
</html>
