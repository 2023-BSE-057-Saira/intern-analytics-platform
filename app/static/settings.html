<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Settings · Ezitech Institute</title>
<link rel="stylesheet" href="/static/css/base.css">
<link rel="stylesheet" href="/static/css/dashboard.css">
</head>
<body>

<div class="app-shell">
  <aside class="sidebar">
    <div class="brand"><span class="dot"></span> EZITECH</div>

    <a href="#" id="dashboardLink" class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>
      Dashboard
    </a>

    <div class="nav-section-label">Account</div>
    <a href="/settings" class="nav-item active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 13.5a2 2 0 0 0 .4 2.2l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a2 2 0 0 0-2.2-.4 2 2 0 0 0-1.2 1.8V20a2 2 0 1 1-4 0v-.2a2 2 0 0 0-1.2-1.8 2 2 0 0 0-2.2.4l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a2 2 0 0 0 .4-2.2 2 2 0 0 0-1.8-1.2H2a2 2 0 1 1 0-4h.2a2 2 0 0 0 1.8-1.2 2 2 0 0 0-.4-2.2l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a2 2 0 0 0 2.2.4H9a2 2 0 0 0 1.2-1.8V2a2 2 0 1 1 4 0v.2a2 2 0 0 0 1.2 1.8 2 2 0 0 0 2.2-.4l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a2 2 0 0 0-.4 2.2v.1a2 2 0 0 0 1.8 1.2H22a2 2 0 1 1 0 4h-.2a2 2 0 0 0-1.8 1.2Z"/></svg>
      Settings
    </a>

    <div class="help-card">
      <h5>Need help?</h5>
      <p>Ezitech Institute · AI-Powered Internship Performance & Risk Analytics Platform.</p>
      <a href="mailto:info@ezitech.org">Contact Support</a>
    </div>
  </aside>

  <div class="main-area">
    <div class="top-search-bar">
      <div style="flex:1"></div>
      <div class="top-user-area">
        <div class="user-menu-wrap">
          <button class="user-menu-trigger" id="userMenuTrigger">
            <div class="avatar-circle" id="topAvatar" style="background:var(--blue)">—</div>
            <div class="name-block">
              <div class="name" id="userName">—</div>
              <div class="role" id="userRole">—</div>
            </div>
            <span class="chevron">▼</span>
          </button>
          <div class="user-menu-dropdown" id="userMenuDropdown">
            <button onclick="logout()">Log out</button>
          </div>
        </div>
      </div>
    </div>

    <div class="page-banner">
      <div class="banner-eyebrow">ACCOUNT</div>
      <h1>Settings</h1>
      <p>Manage your login and account security.</p>
    </div>

    <div class="card-with-header" style="max-width:520px; margin-top:24px;">
      <div class="card-header"><h3>Change Password</h3></div>
      <form id="pwForm" style="padding:24px; display:flex; flex-direction:column; gap:16px;">
        <div class="form-field">
          <label>Current Password</label>
          <input type="password" id="currentPassword" required>
        </div>
        <div class="form-field">
          <label>New Password</label>
          <input type="password" id="newPassword" required minlength="6">
        </div>
        <div class="form-field">
          <label>Confirm New Password</label>
          <input type="password" id="confirmPassword" required minlength="6">
        </div>
        <div id="pwMessage" style="display:none; font-size:13px; padding:10px 12px; border-radius:8px;"></div>
        <button type="submit" class="btn-primary" id="pwSubmitBtn">Update Password</button>
      </form>
    </div>
  </div>
</div>

<script src="/static/js/auth.js"></script>
<script>
const session = requireSession(); // any authenticated role can reach settings
document.getElementById("userName").textContent = session.name || session.email;
document.getElementById("userRole").textContent = session.role.charAt(0).toUpperCase() + session.role.slice(1);
document.getElementById("topAvatar").textContent = (session.name || session.email || "?").charAt(0).toUpperCase();
document.getElementById("dashboardLink").href = "/" + session.role;

document.getElementById("userMenuTrigger").addEventListener("click", () => {
  document.getElementById("userMenuDropdown").classList.toggle("open");
});

document.getElementById("pwForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const current = document.getElementById("currentPassword").value;
  const next = document.getElementById("newPassword").value;
  const confirm = document.getElementById("confirmPassword").value;
  const msg = document.getElementById("pwMessage");
  const btn = document.getElementById("pwSubmitBtn");

  const showMsg = (text, ok) => {
    msg.style.display = "block";
    msg.textContent = text;
    msg.style.background = ok ? "#ecfdf5" : "#fef2f2";
    msg.style.color = ok ? "#059669" : "#dc2626";
  };

  if (next !== confirm) {
    showMsg("New passwords don't match.", false);
    return;
  }

  btn.disabled = true;
  btn.textContent = "Updating…";
  try {
    const res = await apiFetch("/auth/me/password", {
      method: "PATCH",
      body: JSON.stringify({ current_password: current, new_password: next }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || "Could not update password.");
    showMsg("Password updated successfully.", true);
    e.target.reset();
  } catch (err) {
    showMsg(err.message, false);
  } finally {
    btn.disabled = false;
    btn.textContent = "Update Password";
  }
});
</script>
</body>
</html>
